/* --------------------------------------------------------------------------
   DESENHO — utilitários
   -------------------------------------------------------------------------- */
function larg(spr) { let m = 0; for (const l of spr) m = Math.max(m, l.length); return m; }

function sprite(spr, x, y, esc, recolor, espelhar) {
  esc = esc || PX;
  const largura = larg(spr);
  for (let j = 0; j < spr.length; j++) {
    const linha = spr[j];
    for (let i = 0; i < linha.length; i++) {
      const ch = linha[i];
      if (ch === ".") continue;
      const cor = (recolor && recolor[ch]) || CORES[ch];
      if (!cor) continue;
      const col = espelhar ? largura - 1 - i : i;
      ctx.fillStyle = cor;
      ctx.fillRect(Math.round(x + col * esc), Math.round(y + j * esc), esc, esc);
    }
  }
}

// desenha centralizado no ponto (cx, cy)
function spriteC(spr, cx, cy, esc, recolor, espelhar) {
  esc = esc || PX;
  sprite(spr, cx - (larg(spr) * esc) / 2, cy - (spr.length * esc) / 2, esc, recolor, espelhar);
}

function texto(txt, x, y, opc) {
  opc = opc || {};
  const tam = opc.tam || 14;
  ctx.font = (opc.leve ? "" : "bold ") + tam + 'px "Courier New", monospace';
  ctx.textAlign = opc.align || "center";
  ctx.textBaseline = "top";
  if (opc.sombra !== false) {
    ctx.fillStyle = opc.sombra || "#12131a";
    ctx.fillText(txt, x + 2, y + 2);
  }
  ctx.fillStyle = opc.cor || "#ffffff";
  ctx.fillText(txt, x, y);
}

// escreve um texto e desenha um coraçãozinho de pixel do lado
// (a fonte monoespaçada não tem o glifo ♥, então ele é desenhado à mão)
function textoCoracao(txt, x, y, opc) {
  opc = opc || {};
  const tam = opc.tam || 14;
  texto(txt, x, y, opc);
  ctx.font = 'bold ' + tam + 'px "Courier New", monospace';
  const w = ctx.measureText(txt).width;
  sprite(SPR.coracao, x + w / 2 + 7, y + tam / 2 - 5, 2);
}

// versão apagada de qualquer sprite (para itens ainda não coletados no HUD)
const CINZA = {};
for (const k in CORES) if (CORES[k]) CINZA[k] = k === "k" ? "#22262f" : "#3a3f4c";

function painel(x, y, w, h, corBorda) {
  ctx.fillStyle = "rgba(9,11,20,0.9)";
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = corBorda || "#f7c948";
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}

function barra(x, y, w, h, frac, cor, corFundo) {
  frac = Math.max(0, Math.min(1, frac));
  ctx.fillStyle = corFundo || "#1c2030";
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = cor;
  ctx.fillRect(x + 2, y + 2, Math.max(0, (w - 4) * frac), h - 4);
  ctx.strokeStyle = "#12131a";
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}

/* --------------------------------------------------------------------------
   SOM (WebAudio, sem arquivos)
   -------------------------------------------------------------------------- */
const som = { ctx: null, ligado: true };

function acordarAudio() {
  if (!som.ctx) {
    try { som.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  }
  if (som.ctx.state === "suspended") som.ctx.resume();
}

function nota(freq, atraso, dur, tipo, vol) {
  if (!som.ligado || !som.ctx) return;
  const t0 = som.ctx.currentTime + atraso;
  const osc = som.ctx.createOscillator();
  const g = som.ctx.createGain();
  osc.type = tipo || "square";
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol == null ? 0.05 : vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(som.ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.03);
}

function melodia(notas, tipo, vol) {
  let t = 0;
  for (const n of notas) { nota(n[0], t, n[1], tipo, vol); t += n[1]; }
}

const SFX = {
  coleta:  () => melodia([[880, .06], [1320, .09]]),
  item:    () => melodia([[660, .07], [880, .07], [1320, .12]]),
  dano:    () => melodia([[220, .1], [140, .18]], "sawtooth", .07),
  turbo:   () => melodia([[300, .05], [460, .05], [700, .12]], "square", .05),
  grito:   () => melodia([[500, .07], [760, .07], [1000, .16]], "triangle", .07),
  porta:   () => melodia([[400, .08], [600, .08], [900, .2]]),
  fase:    () => melodia([[523, .12], [659, .12], [784, .12], [1047, .3]]),
  vitoria: () => melodia([[523, .14], [659, .14], [784, .14], [1047, .18], [784, .1], [1047, .45]]),
  fim:     () => melodia([[440, .16], [330, .16], [247, .38]], "sawtooth", .06),
};

/* --------------------------------------------------------------------------
   TECLADO
   -------------------------------------------------------------------------- */
const teclas = {};
const apertadas = new Set();
const ordemSetas = [];          // setas na ordem em que foram pressionadas
const SETAS = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"];
const BLOQUEAR = SETAS.concat(["Space"]);

addEventListener("keydown", (e) => {
  if (BLOQUEAR.indexOf(e.code) >= 0) e.preventDefault();
  acordarAudio();
  if (!teclas[e.code]) {
    apertadas.add(e.code);
    if (SETAS.indexOf(e.code) >= 0) ordemSetas.push(e.code);
  }
  teclas[e.code] = true;
});

addEventListener("keyup", (e) => {
  teclas[e.code] = false;
  const i = ordemSetas.indexOf(e.code);
  if (i >= 0) ordemSetas.splice(i, 1);
});

addEventListener("blur", () => { for (const k in teclas) teclas[k] = false; ordemSetas.length = 0; });

function foiApertada(code) { return apertadas.has(code); }

/* --------------------------------------------------------------------------
   ESTADO GERAL
   -------------------------------------------------------------------------- */
const jogo = {
  estado: "TITULO",     // TITULO | FASE1 | INTERVALO | FASE2 | VITORIA | GAMEOVER
  t: 0,
  pontos: 0,
  pontosFase: 0,
  vidas: CONFIG.vidas,
  pausado: false,
  tremor: 0,
  // no game over o jogo volta pra fase em que ele estava, nunca pro começo.
  // cada fase registra aqui como se reiniciar e o nome que aparece na tela.
  reiniciarFase: null,
  nomeFase: "",
};

function trocarEstado(novo) { jogo.estado = novo; jogo.t = 0; }

// toda fase chama isto ao começar: guarda os pontos e como voltar aqui
function abrirFase(nome, reinicio) {
  jogo.pontosFase = jogo.pontos;
  jogo.vidas = CONFIG.vidas;
  jogo.nomeFase = nome;
  jogo.reiniciarFase = reinicio;
}

/* --------------------------------------------------------------------------
   TELA DE TRANSIÇÃO entre fases (genérica)
   -------------------------------------------------------------------------- */
const trans = {};
function mostrarTransicao(titulo, l1, l2, proxima) {
  trans.titulo = titulo;
  trans.l1 = l1;
  trans.l2 = l2;
  trans.proxima = proxima;
  SFX.fase();
  trocarEstado("TRANSICAO");
}

function desenharTransicao() {
  fundoNoite();
  const CHAO = 320;
  ctx.fillStyle = "#2c5f37"; ctx.fillRect(0, 288, W, H - 288);
  ctx.fillStyle = "#8b8b7a"; ctx.fillRect(0, 296, W, H - 296);
  spriteC(SPR.nuna, 196, CHAO - 21, 2);
  spriteC(SPR.tutiBaixo0, 234, CHAO - 17, 2);

  texto(trans.titulo, W / 2, 60, { tam: 26, cor: "#f7c948" });
  painel(50, 110, 380, 62, "#f2a3c7");
  texto(trans.l1, W / 2, 120, { tam: 14, cor: "#ffffff" });
  texto(trans.l2, W / 2, 142, { tam: 14, cor: "#f2a3c7" });
  painel(140, 196, 200, 28);

    texto("APERTE ESPAÇO", W / 2, 336, { tam: 15, cor: "#f7c948" });
}

function tremer(f) { jogo.tremor = Math.max(jogo.tremor, f || 0.35); }

function perderVida() {
  jogo.vidas--;
  SFX.dano();
  tremer(0.4);
  if (jogo.vidas <= 0) {
    SFX.fim();
    trocarEstado("GAMEOVER");
    return true;
  }
  return false;
}

/* ==========================================================================
   MINI-FASE — A MANHÃ EM CASA
   Quatro tarefinhas, uma por tela. Não dá pra perder: é pra ambientar e,
   de quebra, ensinar os controles antes das fases de verdade.
     -1 intro    0 acordar (ESPAÇO)   1 café (← →)
      2 dentes (← →)                  3 vestir (← → + ESPAÇO)   4 sair
   ========================================================================== */
const TAREFAS = [
  { titulo: "HORA DE ACORDAR!", dica: "APERTE ESPAÇO SEM PARAR!" },
  { titulo: "CAFÉ DA MANHÃ!", dica: "USE ← → PRA PEGAR A COMIDA" },
  { titulo: "ESCOVAR OS DENTES!", dica: "USE ← → PRA ESFREGAR" },
  { titulo: "SE ARRUMAR PRA SAIR!", dica: "← → PRA ANDAR, ESPAÇO PRA VESTIR" },
];

const ROUPAS = [
  { chave: "camiseta", spr: "camiseta", nome: "CAMISETA", x: 108 },
  { chave: "calca", spr: "calca", nome: "CALÇA", x: 196 },
  { chave: "tenis", spr: "tenis", nome: "TÊNIS", x: 284 },
  { chave: "mochila", spr: "mochila", nome: "MOCHILA", x: 372 },
];

const COMIDAS = ["pao", "leite", "banana", "bolacha"];

const f0 = {};

function iniciarManha() {
  f0.tarefa = -1;
  f0.tt = 0;
  f0.fim = 0;
  f0.prog = 0;
  f0.msg = "";
  f0.vestido = { camiseta: false, calca: false, tenis: false, mochila: false };
  f0.tutiX = 240;
  f0.caindo = [];
  f0.pegos = 0;
  f0.tCai = 0.6;
  f0.dentes = [];
  for (let i = 0; i < CONFIG.dentesQtd; i++) f0.dentes.push(1);
  f0.escova = 240;
  f0.espuma = [];
  trocarEstado("MANHA");
}

// cores do Tuti conforme o que ele já vestiu (pijama = tudo claro, descalço)
function corTuti() {
  const v = f0.vestido || {};
  const r = {};
  if (!v.camiseta) { r.g = "#b9c2d6"; r.G = "#8d97ad"; }
  if (!v.calca) r.A = "#d3d8e6";
  if (!v.tenis) r.S = "#f3c39a";
  if (!v.mochila) r.a = v.camiseta ? "#3fa34d" : "#b9c2d6";
  return r;
}

function terminarTarefa(msg) {
  f0.fim = 1.6;
  f0.msg = msg;
  SFX.fase();
}

function proximaTarefa() {
  f0.tarefa++;
  f0.tt = 0;
  f0.fim = 0;
  f0.prog = 0;
  f0.msg = "";
}

/* ---------- atualização ---------- */
function atualizarManha(dt) {
  f0.tt += dt;

  // pausa curta de comemoração entre uma tarefa e outra
  if (f0.fim > 0) {
    f0.fim -= dt;
    if (f0.fim <= 0) proximaTarefa();
    return;
  }

  // intro e cena final: só esperam o espaço
  if (f0.tarefa === -1) {
    if (f0.tt > 0.5 && foiApertada("Space")) proximaTarefa();
    return;
  }
  if (f0.tarefa >= TAREFAS.length) {
    if (f0.tt > 0.5 && foiApertada("Space")) iniciarFase1();
    return;
  }

  const v = CONFIG.velQuarto * dt;

  if (f0.tarefa === 0) {
    // ---- ACORDAR: marteladas no espaço ----
    // a queda vem ANTES do aperto: se viesse depois, ela derrubaria o valor
    // logo após o clamp em 100 e a barra nunca fecharia
    f0.prog = Math.max(0, f0.prog - CONFIG.acordarQueda * dt);
    if (foiApertada("Space")) {
      f0.prog = Math.min(100, f0.prog + CONFIG.acordarPorAperto);
      SFX.coleta();
    }
    if (f0.prog >= 100) terminarTarefa("BOM DIA, " + CONFIG.nomeMenino + "!");

  } else if (f0.tarefa === 1) {
    // ---- CAFÉ: pegar a comida que cai ----
    if (teclas.ArrowLeft) f0.tutiX -= v * 1.5;
    if (teclas.ArrowRight) f0.tutiX += v * 1.5;
    f0.tutiX = Math.max(60, Math.min(420, f0.tutiX));

    f0.tCai -= dt;
    if (f0.tCai <= 0 && f0.pegos + f0.caindo.length < CONFIG.cafeMeta) {
      f0.caindo.push({
        x: 70 + Math.random() * 340,
        y: HUD_H - 20,
        tipo: COMIDAS[Math.floor(Math.random() * COMIDAS.length)],
      });
      f0.tCai = CONFIG.cafeIntervalo;
    }
    for (const c of f0.caindo) {
      c.y += CONFIG.cafeQueda * dt;
      // o prato fica logo acima da cabeça, em y = 266
      if (!c.pego && c.y > 248 && c.y < 284 && Math.abs(c.x - f0.tutiX) < 26) {
        c.pego = true;
        f0.pegos++;
        jogo.pontos += 30;
        SFX.item();
      }
    }
    f0.caindo = f0.caindo.filter((c) => !c.pego && c.y < H + 20);
    f0.prog = (f0.pegos / CONFIG.cafeMeta) * 100;
    if (f0.pegos >= CONFIG.cafeMeta) terminarTarefa("QUE DELÍCIA!");

  } else if (f0.tarefa === 2) {
    // ---- DENTES: esfregar de um lado pro outro ----
    if (teclas.ArrowLeft) f0.escova -= CONFIG.velEscova * dt;
    if (teclas.ArrowRight) f0.escova += CONFIG.velEscova * dt;
    const x0 = 90, larguraDente = 300 / CONFIG.dentesQtd;
    f0.escova = Math.max(x0, Math.min(x0 + 300, f0.escova));

    const i = Math.max(0, Math.min(CONFIG.dentesQtd - 1, Math.floor((f0.escova - x0) / larguraDente)));
    const antes = f0.dentes[i];
    f0.dentes[i] = Math.max(0, f0.dentes[i] - CONFIG.dentesForca * dt);
    if (antes > 0 && f0.dentes[i] < antes) {
      for (let n = 0; n < 2; n++) {
        f0.espuma.push({
          x: f0.escova + (Math.random() - 0.5) * 24, y: 178,
          vx: (Math.random() - 0.5) * 60, vy: -40 - Math.random() * 45, vida: 0.8,
        });
      }
    }
    if (antes > 0.02 && f0.dentes[i] <= 0.02) SFX.coleta();

    for (const e of f0.espuma) { e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 130 * dt; e.vida -= dt; }
    f0.espuma = f0.espuma.filter((e) => e.vida > 0);

    // conta dentes prontos (e não a média de sujeira): fica claro quanto falta
    const limpos = f0.dentes.filter((d) => d <= 0.02).length;
    f0.prog = (limpos / CONFIG.dentesQtd) * 100;
    // a setinha aponta pro dente sujo MAIS PERTO da escova, não o mais sujo:
    // senão ela manda a criança atravessar a boca toda a cada dente
    f0.pior = null;
    let melhorDist = Infinity;
    for (let n = 0; n < f0.dentes.length; n++) {
      if (f0.dentes[n] <= 0.02) continue;
      const d = Math.abs(x0 + n * larguraDente + larguraDente / 2 - f0.escova);
      if (d < melhorDist) { melhorDist = d; f0.pior = n; }
    }
    if (limpos === CONFIG.dentesQtd) terminarTarefa("QUE SORRISO LINDO!");

  } else if (f0.tarefa === 3) {
    // ---- VESTIR: andar até cada peça e apertar espaço ----
    if (teclas.ArrowLeft) { f0.tutiX -= v; f0.olhando = -1; }
    if (teclas.ArrowRight) { f0.tutiX += v; f0.olhando = 1; }
    f0.tutiX = Math.max(60, Math.min(420, f0.tutiX));
    f0.andando = !!(teclas.ArrowLeft || teclas.ArrowRight);

    const perto = ROUPAS.find((p) => !f0.vestido[p.chave] && Math.abs(p.x - f0.tutiX) < 28);
    f0.perto = perto || null;
    if (perto && foiApertada("Space")) {
      f0.vestido[perto.chave] = true;
      jogo.pontos += 50;
      SFX.item();
    }
    const postas = ROUPAS.filter((p) => f0.vestido[p.chave]).length;
    f0.prog = (postas / ROUPAS.length) * 100;
    if (postas === ROUPAS.length) terminarTarefa("TÁ PRONTO PRA ESCOLA!");
  }
}

  for (let x = 0; x < W; x += 40) ctx.fillRect(x, 300, 2, H - 300);

  // janela: uma cena de rua vista de lado, com o carro da tia parado esperando

  }
  // caixilho: a travessa vertical só na parte de cima, pra não cortar o carro
  ctx.fillStyle = "#5b3a1a";
  ctx.fillRect(vx + vw / 2 - 2, vy, 4, 44);

  // pôster da escola na parede

  ctx.fillStyle = "#6b421d"; ctx.fillRect(34, 308, 180, 8);
  ctx.fillStyle = "#ffffff"; ctx.fillRect(42, 248, 62, 32);       // travesseiro
  ctx.fillStyle = "#3fa34d"; ctx.fillRect(104, 248, 102, 44);     // coberta
  ctx.fillStyle = "#276b32"; ctx.fillRect(104, 278, 102, 10);

  // mesinha de cabeceira
  ctx.fillStyle = "#5b3a1a"; ctx.fillRect(240, 262, 48, 54);
  ctx.fillStyle = "#8b5a2b"; ctx.fillRect(234, 256, 60, 8);
  ctx.fillStyle = "#472d15"; ctx.fillRect(248, 282, 32, 4);
}

// a boca ampliada no espelho, com os dentes que vão ficando brancos
function desenharBoca() {
  const x0 = 90, w = 300, y0 = 120, h = 110;
  ctx.fillStyle = "#12131a"; ctx.fillRect(x0 - 12, y0 - 12, w + 24, h + 24);
  ctx.fillStyle = "#d9463c"; ctx.fillRect(x0 - 8, y0 - 8, w + 16, h + 16);   // lábios
  ctx.fillStyle = "#7a1f1a"; ctx.fillRect(x0, y0, w, h);                     // dentro da boca
  const ld = w / CONFIG.dentesQtd;
  for (let i = 0; i < CONFIG.dentesQtd; i++) {
    const suj = f0.dentes[i];
    // amarelado -> branco
    const r = Math.round(255 - 8 * (1 - suj)), g = Math.round(255 - 40 * suj), b = Math.round(255 - 130 * suj);
    ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
    ctx.fillRect(x0 + i * ld + 2, y0 + 2, ld - 4, 40);          // dentes de cima
    ctx.fillRect(x0 + i * ld + 2, y0 + h - 42, ld - 4, 40);     // dentes de baixo
    ctx.strokeStyle = "#c8c2ad"; ctx.lineWidth = 2;
    ctx.strokeRect(x0 + i * ld + 3, y0 + 3, ld - 6, 38);
    ctx.strokeRect(x0 + i * ld + 3, y0 + h - 41, ld - 6, 38);
  }
  // setinha piscando em cima do dente mais sujo, pra ele saber pra onde ir
  if (f0.pior != null && f0.dentes[f0.pior] > 0.02 && Math.floor(jogo.t * 5) % 2 === 0) {
    const sx = x0 + f0.pior * ld + ld / 2;
    ctx.fillStyle = "#f7c948";
    ctx.fillRect(sx - 10, y0 - 34, 20, 8);
    ctx.fillRect(sx - 6, y0 - 26, 12, 6);
    ctx.fillRect(sx - 3, y0 - 20, 6, 6);
  }
}

/* ---------- desenho ---------- */
function desenharManha() {
  const tarefa = f0.tarefa;

  if (tarefa === -1) {
    // ------- intro: quarto escuro, despertador tocando, tia buzinando -------
    desenharQuarto(false);
    sprite(SPR.tutiDormindo, 50, 250, 3);
    const tremida = Math.sin(jogo.t * 30) * 3;
    spriteC(SPR.despertador, 264 + tremida, 242, 2);
    texto("RIIING!", 264, 208, { tam: 13, cor: "#f7c948" });

    painel(0, 44, W, 36);
    texto("A MANHÃ DO " + CONFIG.nomeMenino, W / 2, 52, { tam: 20, cor: "#f7c948" });

    painel(128, 96, 176, 66, "#f2a3c7");
    texto(CONFIG.nomeTia + ", LÁ FORA:", 216, 102, { tam: 10, cor: "#f2a3c7" });
    texto('"BI BI! ' + CONFIG.nomeMenino + "!", 216, 120, { tam: 12 });
    texto("ACORDA QUE HOJE", 216, 134, { tam: 11 });
    texto('TEM ESCOLA!"', 216, 146, { tam: 11 });

    if (Math.floor(jogo.t * 2) % 2 === 0)
      texto("APERTE ESPAÇO PRA COMEÇAR", W / 2, 334, { tam: 14, cor: "#f7c948" });
    return;
  }

  if (tarefa >= TAREFAS.length) {
    // ------- cena final: saindo de casa -------
    fundoNoite();
    const CHAO = 322;
    ctx.fillStyle = "#2c5f37"; ctx.fillRect(0, 290, W, H - 290);
    ctx.fillStyle = "#3a3f4c"; ctx.fillRect(0, 300, W, 42);       // rua
    ctx.fillStyle = "#8b8b7a"; ctx.fillRect(0, 294, W, 6);        // meio-fio
    // casa, apoiada na calçada
    ctx.fillStyle = "#d9cfae"; ctx.fillRect(20, 168, 130, 126);
    ctx.fillStyle = "#a8402f"; ctx.fillRect(10, 150, 150, 22);
    ctx.fillStyle = "#5b3a1a"; ctx.fillRect(58, 224, 46, 70);     // porta aberta
    ctx.fillStyle = "#2b1a0c"; ctx.fillRect(64, 230, 34, 64);
    ctx.fillStyle = "#7fc4ff"; ctx.fillRect(112, 190, 26, 24);    // janelinha
    spriteC(SPR.carroLado, 356, CHAO - 12, 2);
    spriteC(SPR.nuna, 262, CHAO - 21, 2);
    spriteC(SPR.tutiBaixo0, 150, CHAO - 17, 2);

    texto("PRONTO PRA ESCOLA!", W / 2, HUD_H + 10, { tam: 22, cor: "#f7c948" });
    painel(70, 96, 340, 48, "#f2a3c7");
    texto('"BORA, ' + CONFIG.nomeMenino + '! ENTRA NO CARRO', W / 2, 102, { tam: 12, cor: "#f2a3c7" });
    texto('QUE A GENTE TÁ ATRASADO!"', W / 2, 118, { tam: 12, cor: "#f2a3c7" });
    if (Math.floor(jogo.t * 2) % 2 === 0)
      texto("ESPAÇO = COMEÇAR A CORRIDA", W / 2, 332, { tam: 14, cor: "#ffffff" });
    return;
  }

  if (tarefa === 0) {
    // ------- acordar -------
    const claro = f0.prog > 55;
    desenharQuarto(claro);
    const tremida = f0.prog < 100 ? Math.sin(jogo.t * 30) * 3 : 0;
    spriteC(SPR.despertador, 264 + tremida, 242, 2);

    if (f0.prog < 30) {
      sprite(SPR.tutiDormindo, 50, 250, 3);
      texto("ZZZzzz...", 150, 212, { tam: 14, cor: "#c8c2ad" });
    } else if (f0.prog < 62) {
      // olhos abertos: os "k" (olhos fechados) viram pele e aparecem duas pupilas
      sprite(SPR.tutiDormindo, 50, 250, 3, { k: "#f3c39a" });
      ctx.fillStyle = "#12131a";
      ctx.fillRect(50 + 3 * 3, 250 + 3 * 3, 3, 3);
      ctx.fillRect(50 + 7 * 3, 250 + 3 * 3, 3, 3);
      texto("HMMM...?", 150, 212, { tam: 14, cor: "#f7c948" });
    } else if (f0.prog < 100) {
      spriteC(SPR.tutiBaixo0, 92, 236, 3, corTuti());    // sentado na cama
      texto("QUASE LÁ!", 200, 200, { tam: 15, cor: "#f7c948" });
    } else {
      spriteC(SPR.tutiBaixo0, 150, 274, 3, corTuti());   // de pé ao lado da cama
    }

  } else if (tarefa === 1) {
    // ------- café da manhã -------
    desenharCozinha();
    for (const c of f0.caindo) spriteC(SPR[c.tipo], c.x, c.y, 2);
    spriteC(SPR.tutiBaixo0, f0.tutiX, 302, 3, corTuti());
    spriteC(SPR.prato, f0.tutiX, 266, 3);
    painel(W / 2 - 64, 332, 128, 24);
    texto("CAFÉ: " + f0.pegos + "/" + CONFIG.cafeMeta, W / 2, 338, { tam: 13, cor: "#f7c948" });

  } else if (tarefa === 2) {
    // ------- escovar os dentes -------
    desenharBanheiro();
    desenharBoca();
    for (const e of f0.espuma) {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(e.x | 0, e.y | 0, 4, 4);
    }
    const balanco = Math.sin(jogo.t * 22) * 3;
    spriteC(SPR.escova, f0.escova + balanco, 175, 3);   // dentro da boca, esfregando
    spriteC(SPR.tutiBaixo0, 54, 296, 3, corTuti());

  } else if (tarefa === 3) {
    // ------- se arrumar -------
    desenharQuarto(true);
    // as roupas ficam penduradas acima da cama, senão o Tuti passa por cima delas
    for (const p of ROUPAS) {
      if (f0.vestido[p.chave]) continue;
      const flut = Math.sin(jogo.t * 3 + p.x) * 2;
      ctx.fillStyle = "#5d6272"; ctx.fillRect(p.x - 2, 186, 4, 10);
      spriteC(SPR[p.spr], p.x, 212 + flut, 3);
      if (f0.perto === p && Math.floor(jogo.t * 5) % 2 === 0) {
        ctx.fillStyle = "#f7c948";               // setinha apontando pra peça
        ctx.fillRect(p.x - 3, 238, 6, 8);
        ctx.fillRect(p.x - 7, 234, 14, 5);
      }
    }
    const q = f0.andando ? Math.floor(jogo.t * 8) % 2 : 0;
    spriteC(q ? SPR.tutiLado1 : SPR.tutiLado0, f0.tutiX, 300, 3, corTuti(), f0.olhando === -1);
    if (f0.perto) {
      painel(f0.tutiX - 46, 248, 92, 22, "#f7c948");
      texto("ESPAÇO!", f0.tutiX, 252, { tam: 12, cor: "#f7c948" });
    }
  }

  // ------- comemoração no fim da tarefa -------
  if (f0.fim > 0) {
    ctx.fillStyle = "rgba(9,11,20,0.55)"; ctx.fillRect(0, 0, W, H);
    painel(50, 150, 380, 56);
    texto(f0.msg, W / 2, 166, { tam: 22, cor: "#f7c948" });
  }

  desenharHudManha();
}

function desenharHudManha() {
  painel(0, 0, W, HUD_H);
  const t = TAREFAS[f0.tarefa];
  texto("TAREFA " + (f0.tarefa + 1) + "/" + TAREFAS.length, 10, 6, { tam: 10, align: "left", cor: "#f3c39a" });
  texto(t.titulo, 10, 20, { tam: 15, align: "left", cor: "#f7c948" });
  texto(t.dica, 470, 6, { tam: 10, align: "right", cor: "#c8c2ad" });
  barra(300, 20, 170, 16, f0.prog / 100, "#3fa34d");
}

/* ==========================================================================

const FAIXAS = [120, 200, 280, 360];            // centros das 4 faixas (amigos e coletáveis)

// a volta pra casa faz o caminho inverso, no fim de tarde
const TRECHOS_VOLTA = [
  {
    nome: "SAINDO DA ESCOLA", aviso: "VALENDO! ULTRAPASSA ELES!",
    grama: "#4a6b3f", asfalto: "#4a4438", faixa: "#f0e6c0",
    deco: "arvore", ritmo: 1.15,
    pesos: [["cone", 0.45], ["poca", 0.30], ["carro", 0.25]],
  },
  {

    grama: "#6b5a48", asfalto: "#453b30", faixa: "#f0e6c0",

  },
  {

    grama: "#4a5240", asfalto: "#37333f", faixa: "#d9cfae",
    deco: "casa", ritmo: 1.0,
    pesos: [["cone", 0.40], ["poca", 0.25], ["carro", 0.35]],
  },
];

// cores dos carros que disputam a corrida de volta
const RIVAIS_COR = [
  { d: "#c9503a", c: "#f0b8a8" },
  { d: "#3fa34d", c: "#a8e0b0" },
  { d: "#7a5ac9", c: "#c8b8f0" },
];

// os coleguinhas do Tuti — mesmo desenho dele, com outras cores
const AMIGOS = [
  { nome: "JOÃO", cor: { g: "#f7c948", G: "#c08f14", H: "#12131a", A: "#2b2f3d" } },
  { nome: "MARIA", cor: { g: "#f2a3c7", G: "#c26e95", H: "#b0793f", A: "#3f6fd1" } },
  { nome: "PEDRO", cor: { g: "#7fc4ff", G: "#3f6fd1", H: "#7a4a24", A: "#2b2f3d" } },
];

const f1 = {};

// a ida e a volta usam o mesmo motor de corrida, só trocando o cenário
function trechosDaFase() { return f1.volta ? TRECHOS_VOLTA : TRECHOS; }

function trechoDe(dist) {
  const t = trechosDaFase();
  return Math.min(t.length - 1, Math.floor(dist / (CONFIG.distTotal / t.length)));
}

// em que lugar da corrida o jogador está (só faz sentido na volta)
function posicaoNaCorrida() {
  if (!f1.rivais) return 1;
  return 1 + f1.rivais.filter((r) => r.dist > f1.dist).length;
}
function ordinal(n) { return n + "º"; }

function iniciarFase1(volta) {
  f1.volta = !!volta;
  abrirFase(
    f1.volta ? "FASE 5 — A CORRIDA DE VOLTA PRA CASA" : "FASE 2 — A CORRIDA PRA ESCOLA",
    function () { iniciarFase1(f1.volta); }
  );
  f1.carroX = 240;
  f1.carroY = 280;
  f1.vel = CONFIG.velBase;
  f1.dist = 0;
  f1.combustivel = CONFIG.combustivelMax;
  f1.obstaculos = [];
  f1.coletaveis = [];
  f1.tSpawn = 1.2;
  f1.tItem = 2.0;
  f1.invenc = 0;
  f1.turbo = 0;
  f1.turboCd = 0;
  f1.chegou = false;
  f1.chegouT = 0;
  f1.aviso = "";
  f1.avisoT = 0;
  f1.trecho = 0;

  // na IDA tem coleguinha pra pegar no ponto de ônibus; na VOLTA eles já estão no carro
  f1.amigos = [];
  if (!f1.volta) {
    const pedaco = CONFIG.distTotal / CONFIG.amigos;
    for (let i = 0; i < CONFIG.amigos; i++) {
      f1.amigos.push({
        idx: i,
        distAlvo: (i + 0.55) * pedaco,
        x: i % 2 === 0 ? FAIXAS[0] : FAIXAS[3],
        y: -120,
        nascido: false, pego: false, perdido: false, avisado: false,
      });
    }
  }

  // na VOLTA é disputa: três carros correndo junto até em casa
  f1.rivais = [];
  if (f1.volta) {
    for (let i = 0; i < CONFIG.qtdRivais; i++) {
      f1.rivais.push({
        idx: i,
        dist: 60 + i * 40,
        x: SLOTS[i === 0 ? 0 : i === 1 ? 2 : 4],
        alvoX: 0,
        vel: CONFIG.velRival[i],
        tFaixa: 1.5 + i,
      });
      f1.rivais[i].alvoX = f1.rivais[i].x;
    }
  }
  f1.melhorPos = CONFIG.qtdRivais + 1;
  trocarEstado("FASE1");
}

function avisoF1(txt, dur) { f1.aviso = txt; f1.avisoT = dur || 2; }

function amigosPegos() { return f1.amigos.filter((a) => a.pego).length; }

// faixas onde tem coleguinha descendo (pra não nascer obstáculo em cima dele)
function faixasOcupadas() {
  return f1.amigos.filter((a) => a.nascido && !a.pego && a.y < H).map((a) => a.x);
}

function sortearTipo(pesos) {
  let s = Math.random();
  for (const p of pesos) { s -= p[1]; if (s <= 0) return p[0]; }
  return pesos[0][0];
}

function nascerObstaculo() {
  const t = trechosDaFase()[f1.trecho];
  const ocupadas = faixasOcupadas();
  // nunca nasce em cima de um coleguinha (nem no slot vizinho, senão fica impossível pegar)
  let livres = SLOTS.filter((x) => !ocupadas.some((o) => Math.abs(o - x) < 61));
  if (!livres.length) return;
  const prog = f1.dist / CONFIG.distTotal;
  // no máximo 2 de uma vez, e nunca em slots vizinhos: sempre sobra um vão pra passar
  const quantos = prog > 0.35 && livres.length > 3 && Math.random() < 0.45 ? 2 : 1;
  for (let n = 0; n < quantos; n++) {
    if (!livres.length) break;
    const x = livres[Math.floor(Math.random() * livres.length)];
    livres = livres.filter((s) => Math.abs(s - x) > 61);
    const tipo = sortearTipo(t.pesos);
    f1.obstaculos.push({
      tipo: tipo, x: x, y: -70,
      velRel: tipo === "carro" ? -95 : 0,
    });
  }
}

function nascerColetavel() {
  const x = FAIXAS[Math.floor(Math.random() * FAIXAS.length)];
  const tipo = f1.combustivel < 45 || Math.random() < 0.4 ? "gasolina" : "estrela";
  f1.coletaveis.push({ tipo: tipo, x: x, y: -40 });
}

function caixaObstaculo(o) {
  if (o.tipo === "cone") return { w: 20, h: 24 };
  if (o.tipo === "poca") return { w: 28, h: 16 };
  return { w: 32, h: 40 };
}

function bateu(ax, ay, aw, ah, bx, by, bw, bh) {
  return Math.abs(ax - bx) * 2 < aw + bw && Math.abs(ay - by) * 2 < ah + bh;
}

function atualizarFase1(dt) {
  // ------- chegada na escola -------
  if (f1.chegou) {
    f1.chegouT += dt;
    f1.dist += Math.max(0, CONFIG.velBase * (1 - f1.chegouT / 1.6)) * dt;
    if (f1.carroY > 235) f1.carroY -= 40 * dt;
    for (const o of f1.obstaculos) o.y += 200 * dt;
    f1.obstaculos = f1.obstaculos.filter((o) => o.y < H + 60);
    if (f1.chegouT > 3.4) {
      if (f1.volta) {
        const pos = f1.posFinal;
        jogo.pontos += 500 + [900, 500, 250, 100][pos - 1];
        mostrarTransicao(
          "CHEGAMOS EM CASA!",
          "VOCÊ TERMINOU EM " + ordinal(pos) + " LUGAR!",
          "AGORA UM PEGA-PEGA NO QUINTAL!",
          iniciarQuintal
        );
      } else {
        jogo.pontos += 500 + amigosPegos() * 200;
        SFX.fase();
        trocarEstado("INTERVALO");
      }
    }
    return;
  }

  // ------- velocidade e turbo -------
  if (foiApertada("Space") && f1.turboCd <= 0) {
    f1.turbo = CONFIG.turboDur;
    f1.turboCd = CONFIG.turboRecarga;
    SFX.turbo();
  }
  f1.turboCd = Math.max(0, f1.turboCd - dt);

  let vel = CONFIG.velBase;
  if (teclas.ArrowUp) vel = CONFIG.velMax;
  else if (teclas.ArrowDown) vel = CONFIG.velMin;
  if (f1.turbo > 0) { vel = CONFIG.turboVel; f1.turbo -= dt; }
  f1.vel = vel;

  // ------- movimento lateral -------
  if (teclas.ArrowLeft) f1.carroX -= CONFIG.velLateral * dt;
  if (teclas.ArrowRight) f1.carroX += CONFIG.velLateral * dt;
  f1.carroX = Math.max(ESTRADA_X0 + 20, Math.min(ESTRADA_X1 - 20, f1.carroX));

  // ------- distância, combustível, pontos -------
  f1.dist += vel * dt;
  jogo.pontos += vel * dt * 0.08;
  f1.combustivel -= CONFIG.gastoCombustivel * dt;
  if (f1.combustivel <= 0) {
    f1.combustivel = 45;
    avisoF1("ACABOU A GASOLINA!");
    if (perderVida()) return;
    f1.invenc = CONFIG.invencivel;
  }

  // ------- mudou de trecho? -------
  const novoTrecho = trechoDe(f1.dist);
  if (novoTrecho !== f1.trecho) {
    f1.trecho = novoTrecho;
    avisoF1(trechosDaFase()[novoTrecho].aviso, 2.8);
    SFX.fase();
  }

  // ------- carros rivais (só na volta) -------
  for (const r of f1.rivais) {
    // elástico: quem fica muito pra trás acelera um pouco, pra disputa não morrer
    const atras = f1.dist - r.dist;
    const ajuste = Math.max(-CONFIG.elastico, Math.min(CONFIG.elastico, atras * 0.05));
    r.dist += (r.vel + ajuste) * dt;

    // de vez em quando trocam de faixa, pra pista não ficar parada
    r.tFaixa -= dt;
    if (r.tFaixa <= 0) {
      r.alvoX = SLOTS[Math.floor(Math.random() * SLOTS.length)];
      r.tFaixa = 2.2 + Math.random() * 2.5;
    }
    r.x += Math.sign(r.alvoX - r.x) * Math.min(Math.abs(r.alvoX - r.x), 70 * dt);

    // bater num rival custa uma vida, igual aos outros carros
    r.y = f1.carroY - (r.dist - f1.dist);
    if (f1.invenc <= 0 && bateu(f1.carroX, f1.carroY, 22, 30, r.x, r.y, 26, 34)) {
      f1.invenc = CONFIG.invencivel;
      avisoF1("ENCOSTOU NO OUTRO CARRO!");
      if (perderVida()) return;
    }
  }
  if (f1.volta) {
    const pos = posicaoNaCorrida();
    if (pos < f1.melhorPos) { f1.melhorPos = pos; if (pos === 1) avisoF1("TÁ EM PRIMEIRO!", 1.8); }
  }

  // ------- coleguinhas no ponto de ônibus -------
  for (const a of f1.amigos) {
    if (a.pego || a.perdido) continue;

    // avisa com antecedência de que lado ele vai aparecer
    if (!a.avisado && f1.dist >= a.distAlvo - CONFIG.avisoAmigo) {
      a.avisado = true;
      avisoF1("AMIGO NO PONTO À " + (a.x < 240 ? "ESQUERDA" : "DIREITA") + "!", 2.6);
      SFX.coleta();
    }
    if (!a.nascido) {
      if (f1.dist >= a.distAlvo) {
        a.nascido = true;
        a.y = -120;
        f1.tSpawn = Math.max(f1.tSpawn, 1.3);   // dá um respiro pra ele conseguir chegar
      }
      continue;
    }
    a.y += vel * dt;
    if (a.y > H + 60) { a.perdido = true; continue; }
    if (bateu(f1.carroX, f1.carroY, 40, 48, a.x, a.y, 24, 30)) {
      a.pego = true;
      jogo.pontos += 150;
      SFX.item();
      avisoF1(AMIGOS[a.idx].nome + " ENTROU NO CARRO!", 2);
    }
  }

  // ------- nascimento -------
  f1.tSpawn -= dt;
  if (f1.tSpawn <= 0) {
    nascerObstaculo();
    const prog = f1.dist / CONFIG.distTotal;
    f1.tSpawn = CONFIG.intervaloObstaculo * TRECHOS[f1.trecho].ritmo * (1 - prog * 0.25) + Math.random() * 0.4;
  }
  f1.tItem -= dt;
  if (f1.tItem <= 0) { nascerColetavel(); f1.tItem = CONFIG.intervaloItem + Math.random() * 1.6; }

  // ------- mover e colidir -------
  f1.invenc = Math.max(0, f1.invenc - dt);
  if (f1.avisoT > 0) f1.avisoT -= dt;

  for (const o of f1.obstaculos) o.y += (vel + o.velRel) * dt;
  f1.obstaculos = f1.obstaculos.filter((o) => o.y < H + 80 && o.y > -220);

  for (const o of f1.obstaculos) {
    if (o.batido) continue;
    const cx = caixaObstaculo(o);
    if (bateu(f1.carroX, f1.carroY, 22, 30, o.x, o.y, cx.w - 6, cx.h - 6)) {
      o.batido = true;
      if (f1.invenc > 0) continue;
      f1.invenc = CONFIG.invencivel;
      avisoF1(o.tipo === "poca" ? "CUIDADO COM A POÇA!" : "AI! DESVIA!");
      if (perderVida()) return;
    }
  }

  for (const c of f1.coletaveis) c.y += vel * dt;
  for (const c of f1.coletaveis) {
    if (c.pego) continue;
    if (bateu(f1.carroX, f1.carroY, 34, 44, c.x, c.y, 22, 24)) {
      c.pego = true;
      if (c.tipo === "gasolina") {
        f1.combustivel = Math.min(CONFIG.combustivelMax, f1.combustivel + 32);
        jogo.pontos += 20;
        SFX.coleta();
      } else {
        jogo.pontos += 60;
        SFX.item();
      }
    }
  }
  f1.coletaveis = f1.coletaveis.filter((c) => !c.pego && c.y < H + 40);

  if (f1.dist >= CONFIG.distTotal) {
    f1.chegou = true;
    f1.chegouT = 0;
    f1.posFinal = posicaoNaCorrida();   // congela o lugar no momento da chegada
  }
}

// a casa do Tuti, vista de cima como a escola, usada na chegada da volta
function desenharCasaDeCima(x, y, w, h) {
  ctx.fillStyle = "#d9cfae"; ctx.fillRect(x, y + 24, w, h - 24);
  ctx.fillStyle = "#c0b492"; ctx.fillRect(x, y + h - 12, w, 12);
  ctx.fillStyle = "#a8402f"; ctx.fillRect(x - 10, y + 10, w + 20, 16);
  ctx.fillStyle = "#c9503a"; ctx.fillRect(x - 6, y, w + 12, 12);
  ctx.fillStyle = "#2b3d63"; ctx.fillRect(x + w / 2 - 56, y + 32, 112, 18);
  texto("CASA DOCE CASA", x + w / 2, y + 36, { tam: 10, cor: "#f7c948" });
  for (const jx of [x + 16, x + w - 46]) {
    ctx.fillStyle = "#2b3d63"; ctx.fillRect(jx, y + 60, 30, 26);
    ctx.fillStyle = "#f7c948"; ctx.fillRect(jx + 3, y + 63, 24, 20);
  }
  ctx.fillStyle = "#5b3a1a"; ctx.fillRect(x + w / 2 - 22, y + 62, 44, h - 62);
  ctx.fillStyle = "#f7c948"; ctx.fillRect(x + w / 2 + 12, y + 84, 5, 5);
}

function desenharEscola(x, y, w, h) {
  // corpo
  ctx.fillStyle = "#d9cfae"; ctx.fillRect(x, y + 26, w, h - 26);
  ctx.fillStyle = "#c0b492"; ctx.fillRect(x, y + h - 14, w, 14);
  // telhado
  ctx.fillStyle = "#a8402f";
  ctx.fillRect(x - 10, y + 12, w + 20, 16);
  ctx.fillStyle = "#c9503a";
  ctx.fillRect(x - 6, y, w + 12, 14);
  // placa
  ctx.fillStyle = "#2b3d63"; ctx.fillRect(x + w / 2 - 78, y + 34, 156, 20);
  texto(CONFIG.nomeEscola, x + w / 2, y + 38, { tam: 12, cor: "#f7c948" });
  // janelas
  for (let i = 0; i < 4; i++) {
    const jx = x + 14 + i * (w - 28) / 4;
    if (i === 1 || i === 2) continue;
    ctx.fillStyle = "#2b3d63"; ctx.fillRect(jx, y + 62, 30, 26);
    ctx.fillStyle = "#7fc4ff"; ctx.fillRect(jx + 3, y + 65, 24, 20);
  }
  // portão
  ctx.fillStyle = "#2b3d63"; ctx.fillRect(x + w / 2 - 30, y + 60, 60, h - 60);
  ctx.fillStyle = "#3f6fd1";
  for (let i = 0; i < 5; i++) ctx.fillRect(x + w / 2 - 26 + i * 11, y + 64, 5, h - 68);
}

// cenário das laterais, muda conforme o trecho
function desenharDeco(tipo, x, y) {
  if (tipo === "casa") {
    ctx.fillStyle = "#d9cfae"; ctx.fillRect(x - 22, y + 12, 44, 32);
    ctx.fillStyle = "#a8402f"; ctx.fillRect(x - 26, y, 52, 14);
    ctx.fillStyle = "#c9503a"; ctx.fillRect(x - 22, y + 12, 44, 5);
    ctx.fillStyle = "#7fc4ff"; ctx.fillRect(x - 15, y + 22, 12, 12);
    ctx.fillStyle = "#5b3a1a"; ctx.fillRect(x + 5, y + 24, 12, 20);
  } else if (tipo === "predio") {
    ctx.fillStyle = "#4a4f60"; ctx.fillRect(x - 24, y - 26, 48, 74);
    ctx.fillStyle = "#5d6272"; ctx.fillRect(x - 24, y - 26, 48, 6);
    for (let a = 0; a < 4; a++) {
      for (let b = 0; b < 3; b++) {
        ctx.fillStyle = (a + b + Math.floor(y)) % 3 === 0 ? "#f7c948" : "#2a2f3d";
        ctx.fillRect(x - 17 + b * 14, y - 16 + a * 16, 9, 10);
      }
    }
  } else {
    ctx.fillStyle = "#5b3a1a"; ctx.fillRect(x - 4, y + 26, 8, 18);
    ctx.fillStyle = "#276b32"; ctx.fillRect(x - 20, y, 40, 30);
    ctx.fillStyle = "#3fa34d"; ctx.fillRect(x - 16, y + 3, 32, 20);
  }
}

// poste do ponto de ônibus, na calçada ao lado do coleguinha
function desenharPonto(x, y) {
  ctx.fillStyle = "#5d6272"; ctx.fillRect(x - 2, y, 4, 34);
  ctx.fillStyle = "#3f6fd1"; ctx.fillRect(x - 14, y - 16, 28, 18);
  ctx.fillStyle = "#f7c948"; ctx.fillRect(x - 11, y - 13, 22, 12);
  ctx.fillStyle = "#12131a"; ctx.fillRect(x - 8, y - 9, 16, 4);
}

function desenharFase1() {
  const tr = trechosDaFase()[f1.trecho];

  // tudo do mundo fica preso abaixo do HUD (senão obstáculos aparecem por trás dele)
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, HUD_H, W, H - HUD_H);
  ctx.clip();

  // grama / calçada
  ctx.fillStyle = tr.grama; ctx.fillRect(0, HUD_H, W, H - HUD_H);
  // asfalto
  ctx.fillStyle = tr.asfalto; ctx.fillRect(ESTRADA_X0, HUD_H, ESTRADA_X1 - ESTRADA_X0, H - HUD_H);
  // meio-fio
  const off = f1.dist % 40;
  for (let y = HUD_H - 40 + off; y < H; y += 40) {
    ctx.fillStyle = "#e8e8e8"; ctx.fillRect(ESTRADA_X0 - 8, y, 8, 20);
    ctx.fillStyle = "#d9463c"; ctx.fillRect(ESTRADA_X0 - 8, y + 20, 8, 20);
    ctx.fillStyle = "#e8e8e8"; ctx.fillRect(ESTRADA_X1, y, 8, 20);
    ctx.fillStyle = "#d9463c"; ctx.fillRect(ESTRADA_X1, y + 20, 8, 20);
  }
  // faixas tracejadas
  ctx.fillStyle = tr.faixa;
  for (const dx of [160, 240, 320]) {
    for (let y = HUD_H - 60 + (f1.dist % 60); y < H; y += 60) ctx.fillRect(dx - 2, y, 4, 28);
  }
  // cenário das laterais
  const offA = f1.dist % 130;
  for (let y = HUD_H - 130 + offA; y < H + 80; y += 130) {
    desenharDeco(tr.deco, 36, y);
    desenharDeco(tr.deco, 444, y);
  }

  // o destino chegando: a escola na ida, a casa na volta
  if (f1.chegou) {
    const p = Math.min(1, f1.chegouT / 1.7);
    const ey = -250 + p * 300;
    if (f1.volta) desenharCasaDeCima(110, ey + 20, 260, 170);
    else desenharEscola(70, ey, 340, 190);
  }

  // carros rivais da corrida de volta
  for (const r of f1.rivais) {
    if (r.y < -70 || r.y > H + 70) continue;
    spriteC(SPR.carro, r.x, r.y, 2, RIVAIS_COR[r.idx]);
  }

  // coleguinhas esperando no ponto
  for (const a of f1.amigos) {
    if (!a.nascido || a.pego || a.y > H + 40) continue;
    desenharPonto(a.x < 240 ? ESTRADA_X0 - 32 : ESTRADA_X1 + 32, a.y - 24);
    const pulo = Math.abs(Math.sin(jogo.t * 6)) * 3;
    spriteC(SPR.tutiBaixo0, a.x, a.y - pulo, 2, AMIGOS[a.idx].cor);
    // setinha piscando pra ele enxergar
    if (Math.floor(jogo.t * 6) % 2 === 0) {
      ctx.fillStyle = "#f7c948";
      ctx.fillRect(a.x - 5, a.y - 34, 10, 5);
      ctx.fillRect(a.x - 2, a.y - 29, 4, 5);
    }
  }

  // coletáveis
  for (const c of f1.coletaveis) {
    if (c.tipo === "gasolina") spriteC(SPR.gasolina, c.x, c.y, 2);
    else spriteC(SPR.estrela, c.x, c.y, 2);
  }

  // obstáculos
  for (const o of f1.obstaculos) {
    if (o.tipo === "cone") spriteC(SPR.cone, o.x, o.y, 2);
    else if (o.tipo === "poca") spriteC(SPR.poca, o.x, o.y, 2);
    else spriteC(SPR.carroFrente, o.x, o.y, 2, { d: "#c9503a", c: "#f0b8a8" });
  }

  // rastro do turbo
  if (f1.turbo > 0) {
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = i % 2 ? "#f7c948" : "#e8853a";
      ctx.fillRect(f1.carroX - 12 + Math.random() * 24, f1.carroY + 22 + i * 7, 5, 6);
    }
  }

  // carro do jogador
  const piscando = f1.invenc > 0 && Math.floor(f1.invenc * 12) % 2 === 0;
  if (!piscando) spriteC(SPR.carro, f1.carroX, f1.carroY, 2);

  // chuva no último trecho
  if (tr.chuva) {
    ctx.fillStyle = "rgba(96,132,200,0.16)";
    ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.fillStyle = "rgba(190,225,255,0.55)";
    for (let i = 0; i < 70; i++) {
      const x = (i * 71 + f1.dist * 0.6) % W;
      const y = HUD_H + ((i * 47 + f1.dist * 2.6) % (H - HUD_H));
      ctx.fillRect(x | 0, y | 0, 1, 8);
    }
  }

  // aviso flutuante
  if (f1.avisoT > 0) {
    ctx.font = 'bold 16px "Courier New", monospace';
    const lt = ctx.measureText(f1.aviso).width + 24;
    painel(W / 2 - lt / 2, 112, lt, 28);
    texto(f1.aviso, W / 2, 118, { tam: 16, cor: "#f7c948" });
  }

  if (f1.chegou) {
    // os amigos que ele pegou descem do carro
    let n = 0;
    for (const a of f1.amigos) {
      if (!a.pego) continue;
      spriteC(SPR.tutiBaixo0, f1.carroX + 34 + n * 26, f1.carroY + 6, 2, AMIGOS[a.idx].cor);
      n++;
    }
    texto(f1.volta ? "CHEGAMOS EM CASA!" : "CHEGAMOS NA ESCOLA!", W / 2, 250, { tam: 20, cor: "#f7c948" });
  } else if (f1.turboCd <= 0) {
    texto("ESPAÇO = TURBO!", W / 2, H - 26, { tam: 12, cor: "#f7c948" });
  }

  ctx.restore();
  desenharHudFase1();
}

function desenharCoracoes(x, y) {
  for (let i = 0; i < CONFIG.vidas; i++) {
    const cheio = i < jogo.vidas;
    sprite(SPR.coracao, x + i * 18, y, 2, cheio ? null : { r: "#3a3f4c" });
  }
}

function desenharHudFase1() {

  desenharCoracoes(10, 16);

  texto("GASOLINA", 82, 5, { tam: 10, align: "left", cor: "#f3c39a" });
  const frac = f1.combustivel / CONFIG.combustivelMax;

  texto(trechosDaFase()[f1.trecho].nome, 210, 5, { tam: 10, align: "left", cor: "#f3c39a" });
  barra(210, 19, 110, 16, f1.dist / CONFIG.distTotal, "#f7c948");

  if (f1.volta) {
    // na volta o que importa é o lugar na corrida, não os amigos
    const pos = f1.chegou ? f1.posFinal : posicaoNaCorrida();

    texto(ordinal(pos), 332, 17, { tam: 20, align: "left", cor: pos === 1 ? "#f7c948" : "#ffffff" });
  } else {
    texto("AMIGOS", 332, 5, { tam: 10, align: "left", cor: "#f3c39a" });
    for (let i = 0; i < f1.amigos.length; i++) {
      sprite(SPR.carinha, 332 + i * 17, 20, 2, f1.amigos[i].pego ? AMIGOS[i].cor : CINZA);
    }
  }

  texto("PONTOS", 470, 4, { tam: 10, align: "right", cor: "#f3c39a" });
  texto(String(Math.floor(jogo.pontos)).padStart(6, "0"), 470, 17, { tam: 18, align: "right", cor: "#f7c948" });
}

/* ==========================================================================
   FASE 2 — DESAFIOS NA ESCOLA
   ========================================================================== */
const TILE = 24;
const MAPA_Y = 48;
const MAPA = [
  "####################",
  "#..................#",
  "#.###.####.###.###.#",
  "#.###....#.###.###.#",
  "#.###.####.###.###.#",
  "#..................#",
  "#.###.####.###.....#",
  "#.###.####.....###.#",
  "#.###.####.###.###.#",
  "#..................#",
  "#.....####.###.###.#",
  "#..................#",
  "####################",
];
const MAPA_COLS = MAPA[0].length;
const MAPA_ROWS = MAPA.length;

// posições em coluna/linha
const POS = {
  inicio: { c: 1, r: 1 },
  nuna: { c: 5, r: 5 },
  porta: { c: 18, r: 11 },
  lapis: { c: 8, r: 3 },
  chave: { c: 16, r: 6 },
  mochila: { c: 12, r: 7 },
  lanche: { c: 3, r: 10 },
};

function cx(c) { return c * TILE + TILE / 2; }
function cy(r) { return MAPA_Y + r * TILE + TILE / 2; }

const ITENS = [
  { chave: "mochila", spr: "mochila", nome: "MOCHILA" },
  { chave: "lapis", spr: "lapis", nome: "LÁPIS" },
  { chave: "lanche", spr: "lanche", nome: "LANCHE" },
  { chave: "chave", spr: "chave", nome: "CHAVE" },
];

const f2 = {};

function iniciarFase2() {
  abrirFase("FASE 3 — DESAFIOS NA ESCOLA", iniciarFase2);
  f2.x = cx(POS.inicio.c);
  f2.y = cy(POS.inicio.r);
  f2.dir = "baixo";
  f2.anim = 0;
  f2.andando = false;
  f2.pegos = { mochila: false, lapis: false, lanche: false, chave: false };
  f2.invenc = 0;
  f2.grito = 0;
  f2.gritoCd = 0;
  f2.msg = "";
  f2.msgT = 0;
  f2.nunaFalou = false;
  f2.monstros = [
    { eixo: "h", x: cx(9), y: cy(9), min: cx(2), max: cx(17), dir: 1 },
    { eixo: "v", x: cx(10), y: cy(3), min: cy(1), max: cy(11), dir: 1 },
  ];
  trocarEstado("FASE2");
}

function msgF2(txt, dur) { f2.msg = txt; f2.msgT = dur || 2.4; }

function paredeEm(px, py) {
  const c = Math.floor(px / TILE);
  const r = Math.floor((py - MAPA_Y) / TILE);
  if (r < 0 || r >= MAPA_ROWS || c < 0 || c >= MAPA_COLS) return true;
  return MAPA[r][c] === "#";
}

function livre(px, py) {
  const h = 8;
  return !paredeEm(px - h, py - h) && !paredeEm(px + h, py - h) &&
         !paredeEm(px - h, py + h) && !paredeEm(px + h, py + h);
}

function centroX(px) { return Math.floor(px / TILE) * TILE + TILE / 2; }
function centroY(py) { return MAPA_Y + Math.floor((py - MAPA_Y) / TILE) * TILE + TILE / 2; }
function aproximar(v, alvo, passo) {
  if (Math.abs(alvo - v) <= passo) return alvo;
  return v + Math.sign(alvo - v) * passo;
}

const DIRS = {
  ArrowLeft: { dx: -1, dy: 0, nome: "esq" },
  ArrowRight: { dx: 1, dy: 0, nome: "dir" },
  ArrowUp: { dx: 0, dy: -1, nome: "cima" },
  ArrowDown: { dx: 0, dy: 1, nome: "baixo" },
};

function atualizarFase2(dt) {
  f2.invenc = Math.max(0, f2.invenc - dt);
  f2.gritoCd = Math.max(0, f2.gritoCd - dt);
  if (f2.grito > 0) f2.grito -= dt;
  if (f2.msgT > 0) f2.msgT -= dt;

  // grito de coragem
  if (foiApertada("Space") && f2.gritoCd <= 0) {
    f2.grito = CONFIG.gritoDur;
    f2.gritoCd = CONFIG.gritoRecarga;
    SFX.grito();
    msgF2("GRITO DE CORAGEM!", 1.2);
  }

  // ------- movimento -------
  let d = null;
  for (let i = ordemSetas.length - 1; i >= 0; i--) {
    if (teclas[ordemSetas[i]]) { d = DIRS[ordemSetas[i]]; break; }
  }
  f2.andando = false;
  if (d) {
    f2.dir = d.nome;
    const v = CONFIG.velTuti * dt;
    if (d.dx !== 0) {
      const alvo = centroY(f2.y);
      if (f2.y !== alvo) {
        const ny = aproximar(f2.y, alvo, v);
        if (livre(f2.x, ny)) { f2.y = ny; f2.andando = true; }
      }
      if (livre(f2.x + d.dx * v, f2.y)) { f2.x += d.dx * v; f2.andando = true; }
    } else {
      const alvo = centroX(f2.x);
      if (f2.x !== alvo) {
        const nx = aproximar(f2.x, alvo, v);
        if (livre(nx, f2.y)) { f2.x = nx; f2.andando = true; }
      }
      if (livre(f2.x, f2.y + d.dy * v)) { f2.y += d.dy * v; f2.andando = true; }
    }
  }
  if (f2.andando) f2.anim += dt * 8; else f2.anim = 0;

  // ------- itens -------
  for (const it of ITENS) {
    if (f2.pegos[it.chave]) continue;
    const p = POS[it.chave];
    if (Math.abs(f2.x - cx(p.c)) < 18 && Math.abs(f2.y - cy(p.r)) < 18) {
      f2.pegos[it.chave] = true;
      jogo.pontos += 200;
      SFX.item();
      msgF2("PEGOU A " + it.nome + "!", 1.8);
    }
  }

  // ------- Tia Nuna -------
  if (Math.abs(f2.x - cx(POS.nuna.c)) < 30 && Math.abs(f2.y - cy(POS.nuna.r)) < 30) {
    if (!f2.nunaFalou) {
      f2.nunaFalou = true;
      if (jogo.vidas < CONFIG.vidas) jogo.vidas++;
      SFX.coleta();
      msgF2("A CHAVE TÁ LÁ NA DIREITA!", 3.5);
    }
    f2.pertoNuna = true;
  } else {
    f2.pertoNuna = false;
  }

  // ------- monstrinhos -------
  if (f2.grito <= 0) {
    for (const m of f2.monstros) {
      const v = CONFIG.velMonstro * dt * m.dir;
      if (m.eixo === "h") {
        m.x += v;
        if (m.x <= m.min) { m.x = m.min; m.dir = 1; }
        if (m.x >= m.max) { m.x = m.max; m.dir = -1; }
      } else {
        m.y += v;
        if (m.y <= m.min) { m.y = m.min; m.dir = 1; }
        if (m.y >= m.max) { m.y = m.max; m.dir = -1; }
      }
    }
  }

  if (f2.invenc <= 0) {
    for (const m of f2.monstros) {
      if (Math.abs(f2.x - m.x) < 18 && Math.abs(f2.y - m.y) < 18) {
        f2.invenc = CONFIG.invencivel;
        msgF2("A BAGUNÇA TE PEGOU!", 2);
        f2.x = cx(POS.inicio.c);
        f2.y = cy(POS.inicio.r);
        f2.dir = "baixo";
        if (perderVida()) return;
        break;
      }
    }
  }

  // ------- porta da sala -------
  const dp = Math.abs(f2.x - cx(POS.porta.c)) < 16 && Math.abs(f2.y - cy(POS.porta.r)) < 16;
  if (dp) {
    if (ITENS.every((it) => f2.pegos[it.chave])) {
      jogo.pontos += 1000 + jogo.vidas * 300;
      mostrarTransicao(
        "CHEGOU NA SALA!",
        "AULA DADA, BARRIGA CHEIA...",
        "AGORA É HORA DO RECREIO!",
        iniciarRecreio
      );
    } else if (f2.msgT <= 0) {
      msgF2("FALTA PEGAR OS ITENS!", 2);
      SFX.porta();
    }
  }
}

function desenharParede(x, y) {
  ctx.fillStyle = "#3b4a63"; ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = "#4d6280"; ctx.fillRect(x, y, TILE, 4);
  ctx.fillStyle = "#2a3548";
  ctx.fillRect(x, y + 11, TILE, 2);
  ctx.fillRect(x + 11, y, 2, 11);
  ctx.fillRect(x + 5, y + 13, 2, 11);
  ctx.fillRect(x + 17, y + 13, 2, 11);
}

function desenharFase2() {
  ctx.fillStyle = "#151a26"; ctx.fillRect(0, HUD_H, W, H - HUD_H);

  // chão + paredes
  for (let r = 0; r < MAPA_ROWS; r++) {
    for (let c = 0; c < MAPA_COLS; c++) {
      const x = c * TILE, y = MAPA_Y + r * TILE;
      if (MAPA[r][c] === "#") { desenharParede(x, y); continue; }
      ctx.fillStyle = (r + c) % 2 ? "#c8c2ad" : "#b8b19a";
      ctx.fillRect(x, y, TILE, TILE);
    }
  }

  // porta da sala
  const px = POS.porta.c * TILE, py = MAPA_Y + POS.porta.r * TILE;
  const completo = ITENS.every((it) => f2.pegos[it.chave]);
  ctx.fillStyle = completo ? "#f7c948" : "#8b5a2b";
  ctx.fillRect(px + 1, py + 1, TILE - 2, TILE - 2);
  ctx.fillStyle = completo ? "#fff2b0" : "#6b421d";
  ctx.fillRect(px + 4, py + 4, TILE - 8, 9);
  ctx.fillStyle = "#12131a";
  ctx.fillRect(px + TILE - 8, py + TILE / 2, 3, 3);
  if (completo && Math.floor(jogo.t * 4) % 2 === 0) {
    ctx.strokeStyle = "#fff2b0"; ctx.lineWidth = 2;
    ctx.strokeRect(px + 1, py + 1, TILE - 2, TILE - 2);
  }
  texto("SALA", px + TILE / 2, py - 14, { tam: 10, cor: completo ? "#f7c948" : "#c8c2ad" });

  // itens
  for (const it of ITENS) {
    if (f2.pegos[it.chave]) continue;
    const p = POS[it.chave];
    const flut = Math.sin(jogo.t * 3 + p.c) * 2;
    spriteC(SPR[it.spr], cx(p.c), cy(p.r) + flut, 2);
  }

  // Tia Nuna
  spriteC(SPR.nuna, cx(POS.nuna.c), cy(POS.nuna.r) - 6, 2);

  // monstrinhos
  for (const m of f2.monstros) {
    const tremida = f2.grito > 0 ? Math.sin(jogo.t * 40) * 2 : 0;
    spriteC(SPR.monstro, m.x + tremida, m.y, 2, f2.grito > 0 ? { c: "#7fc4ff", w: "#dff0ff" } : null);
  }

  // Tuti
  const piscando = f2.invenc > 0 && Math.floor(f2.invenc * 12) % 2 === 0;
  if (!piscando) {
    const q = Math.floor(f2.anim) % 2;
    let spr, esp = false;
    if (f2.dir === "cima") spr = q ? SPR.tutiCima1 : SPR.tutiCima0;
    else if (f2.dir === "baixo") spr = q ? SPR.tutiBaixo1 : SPR.tutiBaixo0;
    else { spr = q ? SPR.tutiLado1 : SPR.tutiLado0; esp = f2.dir === "esq"; }
    spriteC(spr, f2.x, f2.y - 6, 2, null, esp);
  }

  // balãozinho de fala
  if (f2.msgT > 0) {
    ctx.font = 'bold 12px "Courier New", monospace';
    const larguraTxt = ctx.measureText(f2.msg).width + 20;
    const bx = Math.max(6, Math.min(W - larguraTxt - 6, f2.x - larguraTxt / 2));
    const by = Math.max(HUD_H + 4, f2.y - 44);
    painel(bx, by, larguraTxt, 22, "#f7c948");
    texto(f2.msg, bx + larguraTxt / 2, by + 5, { tam: 12, cor: "#ffffff" });
  }

  desenharHudFase2();
}

function desenharHudFase2() {
  painel(0, 0, W, HUD_H);
  desenharCoracoes(10, 16);

  // checklist de itens
  for (let i = 0; i < ITENS.length; i++) {
    const it = ITENS[i];
    const x = 82 + i * 30, y = 12;
    const pego = f2.pegos[it.chave];
    ctx.fillStyle = pego ? "rgba(63,163,77,.35)" : "rgba(255,255,255,.08)";
    ctx.fillRect(x - 2, y - 2, 28, 28);
    spriteC(SPR[it.spr], x + 12, y + 12, 2, pego ? null : CINZA);
  }

  // barra do grito
  texto("GRITO", 214, 5, { tam: 10, align: "left", cor: "#f3c39a" });
  const pronto = f2.gritoCd <= 0;
  barra(214, 19, 100, 16, pronto ? 1 : 1 - f2.gritoCd / CONFIG.gritoRecarga, pronto ? "#f7c948" : "#5d6272");
  if (pronto && Math.floor(jogo.t * 3) % 2 === 0) texto("!", 320, 18, { tam: 16, align: "left", cor: "#f7c948" });

  texto("PONTOS", 470, 4, { tam: 10, align: "right", cor: "#f3c39a" });
  texto(String(Math.floor(jogo.pontos)).padStart(6, "0"), 470, 17, { tam: 18, align: "right", cor: "#f7c948" });
}

/* ==========================================================================
   FASE 4 — RECREIO: ESCONDE-ESCONDE NO PÁTIO
   O Tuti procura os três coleguinhas. Anda solto pelo pátio e aperta espaço
   perto de um esconderijo pra espiar. O HUD dá a dica de "tá quente/tá frio".
   ========================================================================== */
// Move um personagem tentando contornar o que estiver na frente. Sem isso, quem
// empurra reto contra a piscina ou uma árvore simplesmente trava, e uma criança
// fica presa sem entender por quê.
function andarContornando(px, py, d, v, livre) {
  if (livre(px + d.dx * v, py + d.dy * v)) return { x: px + d.dx * v, y: py + d.dy * v, andou: true };
  const perp = d.dx ? [{ x: 0, y: -1 }, { x: 0, y: 1 }] : [{ x: -1, y: 0 }, { x: 1, y: 0 }];
  // Procura de que lado dá pra escapar, olhando até 30px — a largura de uma
  // piscina ou de uma árvore. Olhar só um passo à frente não bastava: o desvio
  // ainda caía dentro do mesmo obstáculo e o personagem travava.
  for (let alcance = 6; alcance <= 30; alcance += 6) {
    for (const p of perp) {
      if (!livre(px + p.x * alcance, py + p.y * alcance)) continue;
      if (!livre(px + p.x * alcance + d.dx * v, py + p.y * alcance + d.dy * v)) continue;
      const mx = px + p.x * v, my = py + p.y * v;
      if (livre(mx, my)) return { x: mx, y: my, andou: true };
    }
  }
  return { x: px, y: py, andou: false };
}

const PATIO_Y = 46;                       // topo da área de brincar
// escalas maiores: uma árvore vista de cima tem que ser bem maior que a criança
const ESCONDERIJOS = [
  { spr: "arvore", x: 72, y: 132, esc: 5 },
  { spr: "arbusto", x: 200, y: 108, esc: 4 },
  { spr: "escorrega", x: 402, y: 132, esc: 4 },
  { spr: "banco", x: 94, y: 294, esc: 4 },
  { spr: "caixaDagua", x: 248, y: 308, esc: 4 },
  { spr: "arvore", x: 416, y: 288, esc: 5 },
];

const PISTAS = [
  { d: 999, txt: "TÁ GELADO...", cor: "#7fc4ff" },
  { d: 210, txt: "TÁ FRIO", cor: "#7fc4ff" },
  { d: 150, txt: "TÁ MORNO", cor: "#f7c948" },
  { d: 95, txt: "TÁ QUENTE!", cor: "#e8853a" },
  { d: 55, txt: "PEGANDO FOGO!", cor: "#d9463c" },
];

const f4 = {};

function iniciarRecreio() {
  abrirFase("FASE 4 — RECREIO NA ESCOLA", iniciarRecreio);
  f4.x = 240;
  f4.y = 190;
  f4.dir = "baixo";
  f4.anim = 0;
  f4.andando = false;
  f4.msg = "";
  f4.msgT = 0;
  f4.tRisada = CONFIG.intervaloRisada;
  f4.risada = null;
  f4.risadaT = 0;
  f4.tempo = 0;

  // sorteia em quais esconderijos os três amigos vão se meter
  const indices = ESCONDERIJOS.map((_, i) => i);
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = indices[i]; indices[i] = indices[j]; indices[j] = tmp;
  }
  f4.locais = ESCONDERIJOS.map(function (e, i) {
    return { ref: e, i: i, amigo: -1, espiado: false };
  });
  for (let a = 0; a < AMIGOS.length; a++) f4.locais[indices[a]].amigo = a;
  f4.achados = 0;
  trocarEstado("RECREIO");
}

function msgF4(txt, dur) { f4.msg = txt; f4.msgT = dur || 1.8; }

// esconderijos são sólidos: o Tuti não passa por dentro
function livreNoPatio(px, py) {
  if (px < 26 || px > W - 26 || py < PATIO_Y + 26 || py > H - 20) return false;
  for (const l of f4.locais) {
    const e = l.ref;
    const lw = larg(SPR[e.spr]) * e.esc / 2, lh = SPR[e.spr].length * e.esc / 2;
    if (Math.abs(px - e.x) < lw - 2 && Math.abs(py - e.y) < lh - 2) return false;
  }
  return true;
}

function distAte(l) { return Math.hypot(f4.x - l.ref.x, f4.y - l.ref.y); }

// o esconderijo não espiado mais perto, e a distância até ele
function pistaAtual() {
  let melhor = null, dist = Infinity;
  for (const l of f4.locais) {
    if (l.espiado || l.amigo < 0) continue;
    const d = distAte(l);
    if (d < dist) { dist = d; melhor = l; }
  }
  return { local: melhor, dist: dist };
}

function atualizarRecreio(dt) {
  f4.tempo += dt;
  if (f4.msgT > 0) f4.msgT -= dt;
  if (f4.risadaT > 0) f4.risadaT -= dt; else f4.risada = null;

  // ------- andar -------
  let d = null;
  for (let i = ordemSetas.length - 1; i >= 0; i--) {
    if (teclas[ordemSetas[i]]) { d = DIRS[ordemSetas[i]]; break; }
  }
  f4.andando = false;
  if (d) {
    f4.dir = d.nome;
    const r = andarContornando(f4.x, f4.y, d, CONFIG.velRecreio * dt, livreNoPatio);
    f4.x = r.x; f4.y = r.y; f4.andando = r.andou;
  }
  f4.anim = f4.andando ? f4.anim + dt * 8 : 0;

  // ------- espiar -------
  if (foiApertada("Space")) {
    let alvo = null, dist = Infinity;
    for (const l of f4.locais) {
      const dd = distAte(l);
      if (dd < dist) { dist = dd; alvo = l; }
    }
    if (!alvo || dist > CONFIG.alcanceEspiar) {
      msgF4("CHEGA MAIS PERTO DE UM ESCONDERIJO!");
    } else if (alvo.espiado) {
      msgF4("JÁ OLHEI AQUI!");
    } else {
      alvo.espiado = true;
      if (alvo.amigo >= 0) {
        f4.achados++;
        jogo.pontos += 250;
        SFX.item();
        msgF4("ACHOU O " + AMIGOS[alvo.amigo].nome + "!", 2.2);
        if (f4.achados === AMIGOS.length) {
          jogo.pontos += 400;
          mostrarTransicao(
            "ACHOU TODO MUNDO!",
            "O RECREIO ACABOU E A AULA TAMBÉM!",
            "A " + CONFIG.nomeTia + " JÁ TÁ NO PORTÃO PRA BUSCAR!",
            function () { iniciarFase1(true); }
          );
          return;
        }
      } else {
        SFX.porta();
        msgF4("NINGUÉM AQUI!");
      }
    }
  }

  // ------- risadinha de quem está escondido -------
  f4.tRisada -= dt;
  if (f4.tRisada <= 0) {
    const p = pistaAtual();
    f4.tRisada = CONFIG.intervaloRisada;
    if (p.local) {
      f4.risada = p.local;
      f4.risadaT = 1.1;
      SFX.coleta();
    }
  }
}

function desenharRecreio() {
  // pátio: grama com um pedaço de quadra cimentada
  ctx.fillStyle = "#3d7a49"; ctx.fillRect(0, PATIO_Y, W, H - PATIO_Y);
  ctx.fillStyle = "#357040";
  for (let y = PATIO_Y; y < H; y += 26) ctx.fillRect(0, y, W, 3);
  ctx.fillStyle = "#a9a897"; ctx.fillRect(150, 150, 200, 130);
  ctx.strokeStyle = "#e8e8e8"; ctx.lineWidth = 2;
  ctx.strokeRect(160, 160, 180, 110);
  ctx.beginPath(); ctx.arc(250, 215, 26, 0, Math.PI * 2); ctx.stroke();

  // muro da escola no fundo
  ctx.fillStyle = "#c0b492"; ctx.fillRect(0, PATIO_Y, W, 22);
  ctx.fillStyle = "#a8402f"; ctx.fillRect(0, PATIO_Y, W, 6);

  // esconderijos (os já espiados ganham um X)
  for (const l of f4.locais) {
    const e = l.ref;
    spriteC(SPR[e.spr], e.x, e.y, e.esc);
    if (l.espiado) {
      ctx.strokeStyle = l.amigo >= 0 ? "#3fa34d" : "#d9463c";
      ctx.lineWidth = 3;
      const r = 12;
      ctx.beginPath();
      ctx.moveTo(e.x - r, e.y - r); ctx.lineTo(e.x + r, e.y + r);
      ctx.moveTo(e.x + r, e.y - r); ctx.lineTo(e.x - r, e.y + r);
      ctx.stroke();
    }
    // amigo já achado fica visível, comemorando ao lado do esconderijo
    if (l.espiado && l.amigo >= 0) {
      spriteC(SPR.tutiBaixo0, e.x + 26, e.y + 10, 2, AMIGOS[l.amigo].cor);
    }
    // risadinha de quem ainda está escondido
    if (f4.risada === l && f4.risadaT > 0) {
      painel(e.x - 26, e.y - 44, 52, 20, "#f7c948");
      texto("HIHI!", e.x, e.y - 40, { tam: 11, cor: "#f7c948" });
    }
  }

  // o Tuti
  const q = Math.floor(f4.anim) % 2;
  let spr, esp = false;
  if (f4.dir === "cima") spr = q ? SPR.tutiCima1 : SPR.tutiCima0;
  else if (f4.dir === "baixo") spr = q ? SPR.tutiBaixo1 : SPR.tutiBaixo0;
  else { spr = q ? SPR.tutiLado1 : SPR.tutiLado0; esp = f4.dir === "esq"; }
  spriteC(spr, f4.x, f4.y, 2, null, esp);

  // dica de "espia aqui" quando está perto de um esconderijo ainda não olhado
  let perto = null, dp = Infinity;
  for (const l of f4.locais) { const dd = distAte(l); if (dd < dp) { dp = dd; perto = l; } }
  if (perto && dp <= CONFIG.alcanceEspiar && !perto.espiado) {
    painel(f4.x - 46, f4.y - 46, 92, 22, "#f7c948");
    texto("ESPAÇO!", f4.x, f4.y - 42, { tam: 12, cor: "#f7c948" });
  }

  if (f4.msgT > 0) {
    ctx.font = 'bold 14px "Courier New", monospace';
    const lt = ctx.measureText(f4.msg).width + 24;
    painel(W / 2 - lt / 2, 300, lt, 26);
    texto(f4.msg, W / 2, 305, { tam: 14, cor: "#f7c948" });
  }

  desenharHudRecreio();
}

function desenharHudRecreio() {
  painel(0, 0, W, HUD_H);
  texto("ESCONDE-ESCONDE", 10, 5, { tam: 10, align: "left", cor: "#f3c39a" });
  texto("ACHOU " + f4.achados + "/" + AMIGOS.length, 10, 18, { tam: 17, align: "left", cor: "#f7c948" });

  // termômetro: o quão perto ele está do amigo escondido mais próximo
  const p = pistaAtual();
  let pista = PISTAS[0];
  for (const q of PISTAS) if (p.dist <= q.d) pista = q;
  texto("TÁ PERTO?", 196, 5, { tam: 10, align: "left", cor: "#f3c39a" });
  texto(pista.txt, 196, 18, { tam: 16, align: "left", cor: pista.cor });

  for (let i = 0; i < AMIGOS.length; i++) {
    const achado = f4.locais.some((l) => l.espiado && l.amigo === i);
    sprite(SPR.carinha, 400 + i * 22, 16, 2, achado ? AMIGOS[i].cor : CINZA);
  }
}

/* ==========================================================================
   FASE 6 — PEGA-PEGA NO QUINTAL DE CASA
   Agora o Tuti é o pegador: precisa encostar no Thomas e na Tia Nuna.
   ========================================================================== */
const QUINTAL_Y = 46;
const MOVEIS = [
  { spr: "arvore", x: 76, y: 166, esc: 5 },
  { spr: "casinhaCao", x: 404, y: 150, esc: 4 },
  { spr: "piscina", x: 250, y: 234, esc: 5 },
  { spr: "arbusto", x: 70, y: 300, esc: 4 },
  { spr: "arvore", x: 410, y: 294, esc: 5 },
];

const f6 = {};

function iniciarQuintal() {
  abrirFase("FASE 6 — PEGA-PEGA NO QUINTAL", iniciarQuintal);
  f6.x = 240;
  f6.y = 300;
  f6.dir = "cima";
  f6.anim = 0;
  f6.andando = false;
  f6.tempo = 0;
  f6.msg = "";
  f6.msgT = 0;
  // um empurrãozinho aleatório na posição inicial pra cada partida sair diferente
  const sorte = () => (Math.random() - 0.5) * 70;
  f6.fugitivos = [
    {
      nome: CONFIG.nomeIrmao, spr: "thomas", vel: CONFIG.velThomas,
      x: 150 + sorte(), y: 130 + sorte(), pego: false, descanso: 0, tDescanso: 99, anim: 0, dir: 1,
    },
    {
      nome: CONFIG.nomeTia, spr: "nuna", vel: CONFIG.velNunaFuga,
      x: 350 + sorte(), y: 250 + sorte(), pego: false,
      descanso: 0, tDescanso: CONFIG.descansoNuna + Math.random() * 2, anim: 0, dir: -1,
      // a tia é esperta: foge dando voltas em vez de correr reto pro canto
      esperto: true, giro: 1, tGiro: 2.5,
    },
  ];
  trocarEstado("QUINTAL");
}

function msgF6(txt, dur) { f6.msg = txt; f6.msgT = dur || 1.8; }

function livreNoQuintal(px, py) {
  if (px < 26 || px > W - 26 || py < QUINTAL_Y + 26 || py > H - 20) return false;
  for (const m of MOVEIS) {
    const lw = larg(SPR[m.spr]) * m.esc / 2, lh = SPR[m.spr].length * m.esc / 2;
    if (Math.abs(px - m.x) < lw - 4 && Math.abs(py - m.y) < lh - 4) return false;
  }
  return true;
}

function atualizarQuintal(dt) {
  f6.tempo += dt;
  if (f6.msgT > 0) f6.msgT -= dt;

  // ------- o Tuti corre atrás -------
  let d = null;
  for (let i = ordemSetas.length - 1; i >= 0; i--) {
    if (teclas[ordemSetas[i]]) { d = DIRS[ordemSetas[i]]; break; }
  }
  f6.andando = false;
  if (d) {
    f6.dir = d.nome;
    const r = andarContornando(f6.x, f6.y, d, CONFIG.velPegador * dt, livreNoQuintal);
    f6.x = r.x; f6.y = r.y; f6.andando = r.andou;
  }
  f6.anim = f6.andando ? f6.anim + dt * 8 : 0;

  // ------- quem foge -------
  for (const g of f6.fugitivos) {
    if (g.pego) continue;

    // a tia para de vez em quando pra tomar fôlego, senão nunca seria pega
    g.tDescanso -= dt;
    if (g.tDescanso <= 0) {
      g.descanso = CONFIG.descansoDur;
      g.tDescanso = CONFIG.descansoNuna + 2;
      if (g.esperto) msgF6("A " + CONFIG.nomeTia + " PAROU! CORRE!", CONFIG.descansoDur);
    }
    if (g.descanso > 0) { g.descanso -= dt; g.anim = 0; }
    else {
      // Escolhe entre 16 direções a que deixa ele mais longe do Tuti sem se
      // encurralar. Somar "vetor de fuga + empurrão da borda" não funciona: ou a
      // fuga vence e ele raspa na parede até ser pego, ou a borda vence e ele
      // corre direto pros braços do Tuti. Testar as direções resolve as duas.
      const v = g.vel * dt;
      const olhada = v * 8;                      // o quanto ele "enxerga" à frente
      let melhorX = 0, melhorY = 0, melhorNota = -Infinity;
      for (let a = 0; a < 16; a++) {
        const ang = (a / 16) * Math.PI * 2;
        const dx = Math.cos(ang), dy = Math.sin(ang);
        const nx = g.x + dx * olhada, ny = g.y + dy * olhada;
        if (!livreNoQuintal(nx, ny)) continue;
        let nota = Math.hypot(nx - f6.x, ny - f6.y);
        // não vale se enfiar num canto, mesmo que momentaneamente fique longe
        const folga = Math.min(nx - 26, W - 26 - nx, ny - (QUINTAL_Y + 26), H - 20 - ny);
        nota += Math.min(folga, 100) * 0.9;
        // leve preferência por manter o rumo, pra não ficar tremendo no lugar
        if (g.ulDx != null) nota += (dx * g.ulDx + dy * g.ulDy) * 12;
        if (nota > melhorNota) { melhorNota = nota; melhorX = dx; melhorY = dy; }
      }
      g.ulDx = melhorX; g.ulDy = melhorY;
      if (livreNoQuintal(g.x + melhorX * v, g.y)) g.x += melhorX * v;
      if (livreNoQuintal(g.x, g.y + melhorY * v)) g.y += melhorY * v;
      if (melhorX !== 0) g.dir = melhorX < 0 ? -1 : 1;
      g.anim += dt * 9;
    }

    // pegou?
    if (Math.hypot(g.x - f6.x, g.y - f6.y) < 24) {
      g.pego = true;
      jogo.pontos += 400;
      SFX.item();
      msgF6("PEGOU " + (g.nome === CONFIG.nomeTia ? "A " : "O ") + g.nome + "!", 2.2);
    }
  }

  if (f6.fugitivos.every((g) => g.pego)) {
    // quanto mais rápido, mais ponto
    jogo.pontos += 800 + Math.max(0, Math.round((60 - f6.tempo) * 20));
    SFX.vitoria();
    criarConfete();
    trocarEstado("VITORIA");
  }
}

function desenharQuintal() {
  // Grama do quintal num verde mais claro que o das folhas. Se usasse o mesmo
  // "#3fa34d" dos sprites de planta, as árvores sumiriam no fundo.
  ctx.fillStyle = "#7bb661"; ctx.fillRect(0, QUINTAL_Y, W, H - QUINTAL_Y);
  ctx.fillStyle = "#6da555";
  for (let y = QUINTAL_Y; y < H; y += 22) ctx.fillRect(0, y, W, 3);

  // parede dos fundos da casa e cerca em volta
  ctx.fillStyle = "#d9cfae"; ctx.fillRect(0, QUINTAL_Y, W, 26);
  ctx.fillStyle = "#5b3a1a"; ctx.fillRect(200, QUINTAL_Y + 6, 40, 20);
  ctx.fillStyle = "#8b5a2b";

  // móveis do quintal
  for (const m of MOVEIS) spriteC(SPR[m.spr], m.x, m.y, m.esc);

  // quem já foi pego senta no chão rindo
  for (const g of f6.fugitivos) {

        painel(g.x - 26, g.y - 44, 52, 20, "#f7c948");
        texto("UFA!", g.x, g.y - 40, { tam: 11, cor: "#f7c948" });
      }
    }
  }

  // o Tuti pegador
  const q = Math.floor(f6.anim) % 2;
  let spr, esp = false;
  if (f6.dir === "cima") spr = q ? SPR.tutiCima1 : SPR.tutiCima0;
  else if (f6.dir === "baixo") spr = q ? SPR.tutiBaixo1 : SPR.tutiBaixo0;
  else { spr = q ? SPR.tutiLado1 : SPR.tutiLado0; esp = f6.dir === "esq"; }
  spriteC(spr, f6.x, f6.y, 2, null, esp);

  if (f6.msgT > 0) {
    ctx.font = 'bold 14px "Courier New", monospace';
    const lt = ctx.measureText(f6.msg).width + 24;
    painel(W / 2 - lt / 2, 300, lt, 26);
    texto(f6.msg, W / 2, 305, { tam: 14, cor: "#f7c948" });
  }

  painel(0, 0, W, HUD_H);
  texto("PEGA-PEGA!", 10, 5, { tam: 10, align: "left", cor: "#f3c39a" });
  texto("VOCÊ É O PEGADOR", 10, 18, { tam: 15, align: "left", cor: "#f7c948" });
  for (let i = 0; i < f6.fugitivos.length; i++) {
    const g = f6.fugitivos[i];
    const x = 236 + i * 118;
    ctx.fillStyle = g.pego ? "rgba(63,163,77,.35)" : "rgba(255,255,255,.08)";
    ctx.fillRect(x - 4, 8, 112, 28);
    texto(g.pego ? "PEGOU!" : g.nome, x + 52, 15, { tam: 12, cor: g.pego ? "#3fa34d" : "#ffffff" });
  }
  texto(f6.tempo.toFixed(1) + "s", 470, 4, { tam: 12, align: "right", cor: "#c8c2ad" });
}

/* ==========================================================================
   TELAS

function fundoNoite() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#101936");
  g.addColorStop(0.55, "#26355f");
  g.addColorStop(1, "#7a4f6a");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // estrelinhas
  for (let i = 0; i < 40; i++) {
    const x = (i * 97) % W, y = (i * 53) % 150;
    ctx.fillStyle = i % 3 === 0 ? "#f7c948" : "#ffffff";
    ctx.fillRect(x, y, 2, 2);
  }
}

  texto("SETAS = ANDAR", 386, 146, { tam: 11 });
  texto("ESPAÇO = AÇÃO", 386, 162, { tam: 11 });

}

function desenharIntervalo() {

  painel(96, 64, 288, 28);
  texto("PONTOS: " + Math.floor(jogo.pontos), W / 2, 70, { tam: 15, cor: "#ffffff" });

  if (f1.amigos) {
    let n = 0;
    for (const a of f1.amigos) {
      if (!a.pego) continue;
      spriteC(SPR.tutiBaixo0, 204 + n * 32, CHAO - 17, 2, AMIGOS[a.idx].cor);

    }

  if (Math.floor(jogo.t * 2) % 2 === 0)
    texto("AGORA OS DESAFIOS LÁ DENTRO! ESPAÇO", W / 2, 336, { tam: 13, cor: "#f7c948" });
}

const confete = [];
function criarConfete() {
  confete.length = 0;
  const cores = ["#f7c948", "#f2a3c7", "#3fa34d", "#7fc4ff", "#d9463c", "#ffffff"];
  for (let i = 0; i < 90; i++) {
    confete.push({
      x: Math.random() * W, y: -Math.random() * H,
      vy: 40 + Math.random() * 90, vx: (Math.random() - 0.5) * 30,
      cor: cores[Math.floor(Math.random() * cores.length)],
      t: Math.random() * 6,
    });
  }
}

function atualizarConfete(dt) {
  for (const c of confete) {
    c.y += c.vy * dt;
    c.x += Math.sin(c.t + jogo.t * 3) * 18 * dt + c.vx * dt;
    if (c.y > H + 8) { c.y = -8; c.x = Math.random() * W; }
  }
}

function desenharVitoria() {
  fundoNoite();
  const CHAO = 328;
  desenharEscola(150, 182, 180, 118);                      // corpo termina em 300
  ctx.fillStyle = "#8b8b7a"; ctx.fillRect(0, 300, W, H - 300);
  ctx.fillStyle = "#9a9a88"; ctx.fillRect(0, 300, W, 4);
  spriteC(SPR.nuna, 72, CHAO - 21, 2);
  spriteC(SPR.tutiBaixo0, 108, CHAO - 17, 2);
  spriteC(SPR.carroLado, 406, CHAO - 12, 2);
  for (const c of confete) { ctx.fillStyle = c.cor; ctx.fillRect(c.x | 0, c.y | 0, 5, 5); }

  texto("MISSÃO", W / 2, 10, { tam: 36, cor: "#f7c948" });
  texto("CUMPRIDA!", W / 2, 46, { tam: 36, cor: "#f7c948" });

  painel(96, 110, 288, 48);
  texto("PONTUAÇÃO FINAL", W / 2, 115, { tam: 11, cor: "#c8c2ad" });
  texto(String(Math.floor(jogo.pontos)).padStart(6, "0"), W / 2, 130, { tam: 24, cor: "#f7c948" });

  if (Math.floor(jogo.t * 2) % 2 === 0)
    texto("ESPAÇO = JOGAR DE NOVO", W / 2, 162, { tam: 14, cor: "#ffffff" });

  painel(56, 332, 368, 26, "#f2a3c7");
  textoCoracao("CONQUISTA: " + CONFIG.nomeTia + " DO ANO", W / 2 - 8, 337, { tam: 13, cor: "#f2a3c7" });
}

function desenharGameOver() {

function desenharPausa() {
  ctx.fillStyle = "rgba(9,11,20,0.75)";

  texto("PAUSADO", W / 2, 140, { tam: 34, cor: "#f7c948" });
  texto("APERTE P PRA VOLTAR", W / 2, 190, { tam: 14 });
}

/* ==========================================================================
   LOOP PRINCIPAL
   ========================================================================== */
let ultimo = 0;

function quadro(agora) {
  requestAnimationFrame(quadro);
  if (!ultimo) ultimo = agora;
  let dt = (agora - ultimo) / 1000;
  ultimo = agora;
  if (dt > 0.05) dt = 0.05;   // evita "teleporte" se a aba travar

  // pausa / som
  if (foiApertada("KeyP") && ["MANHA", "FASE1", "FASE2", "RECREIO", "QUINTAL"].indexOf(jogo.estado) >= 0)
    jogo.pausado = !jogo.pausado;
  if (foiApertada("KeyM")) { som.ligado = !som.ligado; if (som.ligado) SFX.coleta(); }

  if (!jogo.pausado) {
    jogo.t += dt;
    jogo.tremor = Math.max(0, jogo.tremor - dt * 1.6);

    switch (jogo.estado) {
      case "TITULO":
        if (foiApertada("Space")) { jogo.pontos = 0; SFX.fase(); iniciarManha(); }
        break;
      case "MANHA":
        atualizarManha(dt);
        break;
      case "FASE1":
        atualizarFase1(dt);
        break;
      case "INTERVALO":
        if (foiApertada("Space")) iniciarFase2();
        break;
      case "FASE2":
        atualizarFase2(dt);
        break;
      case "RECREIO":
        atualizarRecreio(dt);
        break;
      case "QUINTAL":
        atualizarQuintal(dt);
        break;
      case "TRANSICAO":
        if (jogo.t > 0.5 && foiApertada("Space")) trans.proxima();
        break;
      case "VITORIA":
        atualizarConfete(dt);
        if (jogo.t > 1 && foiApertada("Space")) { jogo.pontos = 0; trocarEstado("TITULO"); }
        break;
      case "GAMEOVER":
        if (jogo.t > 0.6 && foiApertada("Space")) {
          jogo.pontos = jogo.pontosFase;
          if (jogo.reiniciarFase) jogo.reiniciarFase();
        }
        break;
    }
  }

  // ---- desenho ----
  ctx.save();
  if (jogo.tremor > 0) {
    ctx.translate((Math.random() - 0.5) * jogo.tremor * 14, (Math.random() - 0.5) * jogo.tremor * 14);
  }
  ctx.fillStyle = "#0b0d16"; ctx.fillRect(-20, -20, W + 40, H + 40);

  switch (jogo.estado) {
    case "TITULO": desenharTitulo(); break;
    case "MANHA": desenharManha(); break;
    case "FASE1": desenharFase1(); break;
    case "INTERVALO": desenharIntervalo(); break;
    case "FASE2": desenharFase2(); break;
    case "RECREIO": desenharRecreio(); break;
    case "QUINTAL": desenharQuintal(); break;
    case "TRANSICAO": desenharTransicao(); break;
    case "VITORIA": desenharVitoria(); break;
    case "GAMEOVER": desenharGameOver(); break;
  }
  ctx.restore();

  if (jogo.pausado) desenharPausa();
  if (!som.ligado) texto("SOM OFF", 470, H - 16, { tam: 10, align: "right", cor: "#5d6272" });

  apertadas.clear();
}

requestAnimationFrame(quadro);
</script>
